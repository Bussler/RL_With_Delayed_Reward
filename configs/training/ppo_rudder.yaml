# Default training configuration for PPO + RUDDER on the drone environment.
# Inherits the same PPO / env / experiment structure as ppo.yaml and adds a
# `rudder` section.  Override any value at runtime with: --set key.nested=value

model_path: ""
training_length: 300000
eval_length: 1000
eval_render_interval: 5

experiment:
  experiment_name: rudder_lstm
  directory: skrl/drone_ppo_tensorboard
  write_interval: 300
  checkpoint_interval: 10000

env:
  drone_config_path: configs/drone_env/default_config.yaml
  renderer: matplotlib
  render_mode: rgb_array

ppo:
  rollouts: 2048
  learning_epochs: 10
  mini_batches: 32
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 3.0e-4
  kl_threshold_scheduler: 0.008
  grad_norm_clip: 0.5
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: true
  entropy_loss_scale: 0.01
  value_loss_scale: 0.5
  use_lstm: true

rudder:
  alpha: 0.3               # blend: alpha*r_rudder + (1-alpha)*r_original
  warmup_episodes: 50      # episodes to collect before redistribution activates
  train_interval: 10       # train return predictor every N completed episodes
  train_epochs: 5          # training passes per predictor training trigger
  batch_size: 16           # episode batch size from lessons buffer per epoch
  buffer_size: 500         # maximum episodes in lessons buffer
  predictor_lr: 3.0e-4     # learning rate for RUDDER return predictor LSTM
  predictor_hidden: 128    # LSTM hidden size for return predictor
